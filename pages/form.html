                    <button
                        class="hamburgerMenu"
                        type="button"
                        aria-label="Toggle navigation menu"
                        aria-controls="primary-navigation"

                        <span class="bar1" aria-hidden="true" style="display: block;"></span>

        <main>
    <div id="survey">
        <form name="contact" method="POST" data-netlify="true" data-netlify-recaptcha="true" id="form">
            <label><h3>Survey</h3></label>
            <label for="name">Name (Required): </label>
            <input id="name" type="name" name="name" placeholder="Name" class="inputs" required/>
            <br>
            <label for="email">Email (Required): </label>
            <input id="email" type="email" name="email" placeholder="Email" class="inputs" autocomplete="email" required/>
            <br>

            <label for="phone">Phone Number: </label>
            <input id="phone" type="tel" name="phone" placeholder="Number" class="inputs" autocomplete="tel-local" required/>
            <br>

            <label for="perm">Would you like a contact back? (required):</label>
            <select name="Would you like a contact back?" id="perm" class="inputs" autocomplete="name" required>
            <optgroup label="Please select one">
                <option value="no">No</option>
                <option value="yes">Yes</option>
            </optgroup>

            </select>

            <br>

            <label for="message">Message (Required): </label>
            <textarea id="message" name="message" placeholder="Message" class="inputs" required></textarea>
            <br>
            <label for="captcha">If the page refreshes instead of a confirmation page the captcha failed and the form did not submit</label>
            <div data-netlify-recaptcha="true"  id="captcha"></div>
            
            <br>
            <button type="submit" class="btn" id="Submit">Submit!</button>
            <a href="mailto:&#65;&#110;&#100;&#114;&#101;&#119;&#64;&#97;&#110;&#100;&#114;&#101;&#119;&#110;&#97;&#115;&#104;&#101;&#100;&#46;&#111;&#114;&#103;">
            <button class="btn">Email Me!</button>
            </a>
        </form>
        
    </div>
        </main>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuButton = document.querySelector(".hamburgerMenu");
            const navigationList = document.getElementById("primary-navigation");
            const identityButton = document.getElementById("identity-button");

            const toggleMenu = () => {
                const isOpen = navigationList.classList.toggle("show");
                menuButton.classList.toggle("change", isOpen);
                menuButton.setAttribute("aria-expanded", String(isOpen));
            };

            menuButton.addEventListener("click", toggleMenu);

            identityButton.addEventListener("click", () => {
                if (window.netlifyIdentity) {
                    window.netlifyIdentity.open();
                }
            });

            if (window.netlifyIdentity) {
                window.netlifyIdentity.init();
            }
        });
    </script>
</body>
